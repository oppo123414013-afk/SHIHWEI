<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日動態報告 — PGY 分析中心</title>
<style>
:root{--bg:#0d1117;--s:#161b22;--s2:#1c2128;--bd:#30363d;--t:#e6edf3;--m:#8b949e;--bl:#58a6ff;--g:#3fb950;--r:#f85149;--y:#d29922;--p:#bc8cff;--o:#ffa657}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;line-height:1.6}

/* Nav */
.nav{position:sticky;top:0;background:rgba(13,17,23,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);z-index:100;padding:0 24px}
.nav-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:2px;height:54px;overflow-x:auto}
.nav-logo{font-size:15px;font-weight:800;color:var(--bl);margin-right:16px;text-decoration:none;white-space:nowrap;letter-spacing:-.5px}
.nav a{color:var(--m);text-decoration:none;font-size:13px;padding:6px 12px;border-radius:6px;transition:all .2s;white-space:nowrap}
.nav a:hover{color:var(--t);background:var(--s2)}
.nav a.active{color:var(--t);background:var(--s2)}

.wrap{max-width:1200px;margin:0 auto;padding:32px 20px}

/* Page header */
.ph{background:linear-gradient(135deg,#1a2744,#0d1117);border:1px solid rgba(88,166,255,.2);border-radius:16px;padding:36px;margin-bottom:28px;position:relative;overflow:hidden}
.ph::before{content:'';position:absolute;top:-80px;right:-80px;width:250px;height:250px;background:radial-gradient(circle,rgba(88,166,255,.1),transparent 70%);pointer-events:none}
.ph-tag{font-size:11px;color:var(--bl);font-weight:700;letter-spacing:3px;margin-bottom:6px}
.ph-title{font-size:26px;font-weight:800;margin-bottom:6px}
.ph-sub{color:var(--m);font-size:14px}
.ph-stats{display:flex;gap:28px;margin-top:20px;flex-wrap:wrap}
.ph-stat{display:flex;flex-direction:column;gap:2px}
.ph-stat-val{font-size:22px;font-weight:700}
.ph-stat-label{font-size:11px;color:var(--m)}

/* Stats row */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}
@media(max-width:600px){.stats-row{grid-template-columns:1fr}}
.stat-card{background:var(--s);border:1px solid var(--bd);border-radius:10px;padding:16px}
.stat-label{font-size:11px;color:var(--m);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.stat-val{font-size:22px;font-weight:700}

/* Section */
.sec{margin-bottom:28px}
.sec-title{font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}

/* Report grid */
.report-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}

/* Report card */
.rcard{background:var(--s);border:1px solid var(--bd);border-radius:12px;padding:18px;transition:border-color .2s}
.rcard:hover{border-color:rgba(88,166,255,.4)}
.rcard.latest{border-color:rgba(63,185,80,.3);background:linear-gradient(135deg,rgba(63,185,80,.04),var(--s))}
.rc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.rc-date{font-size:15px;font-weight:700}
.rc-weekday{font-size:11px;color:var(--m);margin-top:2px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.bg{background:rgba(63,185,80,.15);color:var(--g)}
.br{background:rgba(248,81,73,.15);color:var(--r)}
.bb{background:rgba(88,166,255,.15);color:var(--bl)}
.by{background:rgba(210,153,34,.15);color:var(--y)}
.bp{background:rgba(188,140,255,.15);color:var(--p)}
.rc-highlight{font-size:13px;color:var(--m);margin-bottom:12px;line-height:1.5}
.rc-price{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.rc-price-val{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.rc-price-chg{font-size:12px;font-weight:600;padding:2px 7px;border-radius:10px}
.rc-price-chg.pos{background:rgba(63,185,80,.15);color:var(--g)}
.rc-price-chg.neg{background:rgba(248,81,73,.15);color:var(--r)}
.rc-links{display:flex;gap:8px;flex-wrap:wrap}
.rc-link{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:7px;font-size:12px;font-weight:600;text-decoration:none;transition:all .2s;border:1px solid}
.rc-link.pdf{color:var(--o);border-color:rgba(255,166,87,.3);background:rgba(255,166,87,.06)}
.rc-link.pdf:hover{background:rgba(255,166,87,.12)}
.rc-link.md{color:var(--bl);border-color:rgba(88,166,255,.3);background:rgba(88,166,255,.06)}
.rc-link.md:hover{background:rgba(88,166,255,.12)}

/* Latest report highlight */
.latest-banner{background:linear-gradient(135deg,rgba(63,185,80,.1),rgba(88,166,255,.05));border:1px solid rgba(63,185,80,.25);border-radius:12px;padding:24px;margin-bottom:28px}
.lb-tag{font-size:11px;color:var(--g);font-weight:700;letter-spacing:2px;margin-bottom:6px}
.lb-title{font-size:18px;font-weight:700;margin-bottom:8px}
.lb-stats{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px}
.lb-stat{display:flex;flex-direction:column;gap:2px}
.lb-stat-label{font-size:11px;color:var(--m)}
.lb-stat-val{font-size:15px;font-weight:700}
.lb-links{display:flex;gap:10px;margin-top:16px}

/* Footer */
.footer{text-align:center;padding:36px 20px 28px;color:var(--m);font-size:12px;border-top:1px solid var(--bd);margin-top:8px}
.footer a{color:var(--bl);text-decoration:none}

/* Skeleton loader */
.skeleton{background:linear-gradient(90deg,var(--s) 25%,var(--s2) 50%,var(--s) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:6px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="pgy_live_dashboard.html" class="nav-logo">PGY 分析中心</a>
    <a href="pgy_live_dashboard.html">即時監控</a>
    <a href="reports.html" class="active">每日報告</a>
  </div>
</nav>

<div class="wrap">

  <!-- PAGE HEADER -->
  <div class="ph">
    <div class="ph-tag">PAGAYA TECHNOLOGIES · NASDAQ: PGY</div>
    <div class="ph-title">每日動態報告</div>
    <div class="ph-sub">每日更新的 PGY 股價走勢、重要公告、AI 分析觀點完整歸檔</div>
    <div class="ph-stats">
      <div class="ph-stat"><span class="ph-stat-val" id="stat-count">—</span><span class="ph-stat-label">報告總數</span></div>
      <div class="ph-stat"><span class="ph-stat-val" id="stat-earliest">—</span><span class="ph-stat-label">最早報告</span></div>
      <div class="ph-stat"><span class="ph-stat-val" id="stat-latest">—</span><span class="ph-stat-label">最新報告</span></div>
    </div>
  </div>

  <!-- LATEST REPORT HIGHLIGHT -->
  <div id="latest-banner" class="latest-banner">
    <div class="lb-tag">📌 最新報告</div>
    <div class="lb-title skeleton" style="height:26px;width:60%;margin-bottom:10px">&nbsp;</div>
    <div class="skeleton" style="height:14px;width:90%;margin-bottom:6px">&nbsp;</div>
    <div class="skeleton" style="height:14px;width:75%">&nbsp;</div>
  </div>

  <!-- ALL REPORTS -->
  <div class="sec">
    <div class="sec-title">📅 所有報告</div>
    <div id="report-grid" class="report-grid">
      <div style="color:var(--m);padding:20px;grid-column:1/-1">載入報告中…</div>
    </div>
  </div>

</div>

<div class="footer">
  <p style="font-size:14px;font-weight:600;color:var(--t);margin-bottom:6px">PGY 分析中心 · 每日動態報告</p>
  <p>報告資料涵蓋 <span id="footer-range">—</span> &nbsp;·&nbsp; <a href="pgy_live_dashboard.html">即時監控</a></p>
  <p style="margin-top:8px">本站內容由 Claude AI 自動生成，<strong>僅供資訊參考，不構成任何投資建議。</strong></p>
</div>

<script>
(function(){
  var OWNER='oppo123414013-afk', REPO='pgy-monitor';
  var API='https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/Pagaya_Daily/reports';
  var RAW='https://raw.githubusercontent.com/'+OWNER+'/'+REPO+'/main/Pagaya_Daily/reports/';
  var BLOB='https://github.com/'+OWNER+'/'+REPO+'/blob/main/Pagaya_Daily/reports/';
  var WD=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

  function wd(d){return WD[new Date(d+'T12:00:00').getDay()];}
  function isWknd(d){var n=new Date(d+'T12:00:00').getDay();return n===0||n===6;}

  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  function parseCard(md,dateStr){
    var price=null,chg=null,highlight='';
    var badge=isWknd(dateStr)?{cls:'by',text:'週末快報'}:{cls:'bb',text:'每日報告'};

    // Price: try multiple patterns
    var pm=md.match(/收盤[價]?[^$\n\r]*?\$\s*([\d]+\.[\d]+)/)
      ||md.match(/\|\s*收盤[^|]*\|\s*\$?\s*([\d,]+\.[\d]+)/)
      ||md.match(/close\s*[：:$]\s*\$?\s*([\d]+\.[\d]+)/i)
      ||md.match(/\$\s*(1[0-9]\.[0-9]{2})\b/);
    if(pm)price='$'+pm[1];

    // Change: +X.X% or -X.X%
    var cm=md.match(/([+＋]\s*[\d]+\.?[\d]*\s*%)/)||md.match(/([-−]\s*[\d]+\.?[\d]*\s*%)/);
    if(cm)chg=cm[1].replace(/\s+/g,'').replace('＋','+').replace('−','-');

    // Highlight: first non-trivial, non-header line
    var lines=md.split(/\r?\n/);
    for(var i=0;i<lines.length;i++){
      var l=lines[i].trim();
      if(!l||l.startsWith('#')||l.startsWith('|')||l.startsWith('>')||l.startsWith('---'))continue;
      l=l.replace(/\*\*/g,'').replace(/\*/g,'').replace(/`/g,'');
      if(l.length>=20){
        highlight=l.length>150?l.slice(0,147)+'…':l;
        break;
      }
    }

    // Badge keyword detection (override if not weekend)
    if(!isWknd(dateStr)){
      if(md.match(/Q[1-4]\s*(20\d\d)?\s*財報|EPS.*超預期|財報.*亮眼/)){
        badge={cls:'bg',text:'財報日 ⭐'};
      } else if(md.match(/ABS.*完成|ABS.*定價|完成.*ABS/)){
        badge={cls:'bg',text:'ABS 完成'};
      } else if(/Experian/.test(md)){
        badge={cls:'bb',text:'Experian 合作'};
      } else if(/財報前夕|財報.*明[日天]/.test(md)){
        badge={cls:'by',text:'財報前夕'};
      } else if(chg){
        var neg=chg.startsWith('-')||chg.startsWith('−');
        var num=parseFloat(chg.replace(/[^0-9.]/g,''));
        if(neg&&num>=4)badge={cls:'br',text:'技術回撤'};
        else if(neg)badge={cls:'br',text:'小幅回落'};
        else if(num>=8)badge={cls:'bg',text:'強力上漲'};
        else if(num>=3)badge={cls:'bg',text:'溫和反彈'};
        else badge={cls:'bg',text:'低位回升'};
      }
    }

    return {price:price,chg:chg,highlight:highlight,badge:badge};
  }

  function buildCard(dateStr,data,isLatest){
    var weekday=wd(dateStr);
    var pdfUrl='../Pagaya_Daily/pdf/'+dateStr+'_report.pdf';
    var mdUrl=BLOB+dateStr+'_report.md';
    var cls='rcard'+(isLatest?' latest':'');
    var extraStyle=isLatest?'':((dateStr==='2026-05-07')?'style="border-color:rgba(63,185,80,.4)"':'');

    var badge=data?data.badge:{cls:'bb',text:'每日報告'};
    if(isWknd(dateStr))badge={cls:'by',text:'週末快報'};

    var priceHtml='';
    if(data&&data.price){
      var isPos=data.chg&&data.chg.startsWith('+');
      var isNeg=data.chg&&data.chg.startsWith('-');
      var chgHtml=data.chg?'<span class="rc-price-chg '+(isPos?'pos':isNeg?'neg':'')+'">'+esc(data.chg)+'</span>':'';
      priceHtml='<div class="rc-price"><span class="rc-price-val">'+esc(data.price)+'</span>'+chgHtml+'</div>';
    }

    var hlHtml=data&&data.highlight?'<div class="rc-highlight">'+esc(data.highlight)+'</div>':'';

    return '<div class="'+cls+'" '+extraStyle+'>'
      +'<div class="rc-top">'
        +'<div><div class="rc-date">'+dateStr+'</div><div class="rc-weekday">'+weekday+'</div></div>'
        +'<span class="badge '+badge.cls+'">'+badge.text+'</span>'
      +'</div>'
      +priceHtml+hlHtml
      +'<div class="rc-links">'
        +'<a href="'+pdfUrl+'" class="rc-link pdf" target="_blank">📄 PDF</a>'
        +'<a href="'+mdUrl+'" class="rc-link md" target="_blank">📝 MD</a>'
      +'</div>'
    +'</div>';
  }

  function renderBanner(dateStr,data){
    var el=document.getElementById('latest-banner');
    if(!el)return;
    var weekday=wd(dateStr);
    var pdfUrl='../Pagaya_Daily/pdf/'+dateStr+'_report.pdf';
    var mdUrl=BLOB+dateStr+'_report.md';
    var desc=(data&&data.highlight)?esc(data.highlight):'最新報告';
    var priceStats='';
    if(data&&data.price){
      var isPos=data.chg&&data.chg.startsWith('+');
      var col=isPos?'var(--g)':'var(--r)';
      priceStats='<div class="lb-stats">'
        +'<div class="lb-stat"><span class="lb-stat-label">收盤價</span><span class="lb-stat-val" style="color:'+col+'">'+esc(data.price)+'</span></div>'
        +(data.chg?'<div class="lb-stat"><span class="lb-stat-label">漲跌幅</span><span class="lb-stat-val" style="color:'+col+'">'+esc(data.chg)+'</span></div>':'')
      +'</div>';
    }
    el.innerHTML='<div class="lb-tag">📌 最新報告</div>'
      +'<div class="lb-title">'+dateStr+'（'+weekday.slice(2)+'）</div>'
      +'<div style="font-size:13px;color:var(--m);line-height:1.6">'+desc+'</div>'
      +priceStats
      +'<div class="lb-links">'
        +'<a href="'+pdfUrl+'" class="rc-link pdf" target="_blank">📄 下載 PDF</a>'
        +'<a href="'+mdUrl+'" class="rc-link md" target="_blank">📝 查看 Markdown</a>'
      +'</div>';
  }

  function render(payload){
    var dates=payload.dates, data=payload.data;
    if(!dates||!dates.length){showError();return;}

    var cnt=document.getElementById('stat-count');
    var ear=document.getElementById('stat-earliest');
    var lat=document.getElementById('stat-latest');
    var ftr=document.getElementById('footer-range');
    if(cnt)cnt.textContent=dates.length;
    if(ear)ear.textContent=dates[dates.length-1];
    if(lat)lat.textContent=dates[0];
    if(ftr)ftr.textContent=dates[dates.length-1]+' 至 '+dates[0];

    renderBanner(dates[0],data[dates[0]]);

    var grid=document.getElementById('report-grid');
    if(grid)grid.innerHTML=dates.map(function(d,i){return buildCard(d,data[d],i===0);}).join('');
  }

  function showError(){
    var grid=document.getElementById('report-grid');
    if(grid)grid.innerHTML='<div style="color:var(--m);padding:20px;grid-column:1/-1">載入失敗，請稍後重試。</div>';
    var el=document.getElementById('latest-banner');
    if(el)el.innerHTML='<div class="lb-tag">📌 最新報告</div><div style="color:var(--m)">無法取得資料</div>';
  }

  function init(){
    var cached=sessionStorage.getItem('pgy_reports_v3');
    if(cached){try{var p=JSON.parse(cached);if(p&&p.dates&&p.dates.length){render(p);return;}}catch(e){}}

    fetch(API)
      .then(function(r){
        if(!r.ok)throw new Error('API '+r.status);
        return r.json();
      })
      .then(function(files){
        if(!Array.isArray(files))throw new Error('unexpected response');
        var dates=files
          .filter(function(f){return /^\d{4}-\d{2}-\d{2}_report\.md$/.test(f.name);})
          .map(function(f){return f.name.slice(0,10);})
          .sort().reverse();
        if(!dates.length){showError();return;}

        // Fetch all MD files in parallel (raw CDN, no rate limit)
        Promise.all(dates.map(function(d){
          return fetch(RAW+d+'_report.md')
            .then(function(r){return r.ok?r.text():null;})
            .catch(function(){return null;});
        })).then(function(texts){
          var data={};
          dates.forEach(function(d,i){data[d]=texts[i]?parseCard(texts[i],d):null;});
          var payload={dates:dates,data:data};
          try{sessionStorage.setItem('pgy_reports_v3',JSON.stringify(payload));}catch(e){}
          render(payload);
        });
      })
      .catch(function(){showError();});
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',init);
  }else{
    init();
  }
})();
</script>

</body>
</html>
